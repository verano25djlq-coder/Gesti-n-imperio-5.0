name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer código fuente si se subió como ZIP
        run: |
          if [ ! -f package.json ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*SOURCE*.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "No se encontró package.json ni un ZIP *SOURCE*.zip en la raíz."
              exit 1
            fi
            unzip -o "$ZIP_FILE" -x '.github/workflows/*' -d .
          fi
          test -f package.json
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install
      - name: Construir aplicación web
        run: npm run build
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Sincronizar Capacitor y SQLite
        run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Imperio-Disco-Gestion-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
